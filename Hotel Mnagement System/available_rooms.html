<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Available Rooms - KHAAB GHAR</title>

  <!-- Bootstrap CSS for styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Page background and font */
    body {
      background: linear-gradient(#bfbaa1, #e8e5d1);
      font-family: 'Segoe UI', sans-serif;
    }

    /* Container styling */
    .container {
      background-color: #f8f7eb;
      padding: 40px;
      border-radius: 15px;
      margin-top: 60px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    /* Heading style */
    h2 {
      color: #5a4e3c;
      font-weight: bold;
    }

    /* Table styling */
    .table {
      background-color: #fff;
      border-radius: 10px;
      overflow: hidden;
    }

    /* Table header style */
    .table th {
      background-color: #6a644c !important;
      color: #fff;
    }

    /* Table data cells */
    .table td {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4 text-center">Available Rooms</h2>

    <!-- Table for displaying available rooms -->
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Price</th>
          <th>View</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody id="availableRoomsTableBody"></tbody> <!-- Dynamic content goes here -->
    </table>
  </div>

  <script>
    // Fetch all room data from localStorage or default to an empty array
    const rooms = JSON.parse(localStorage.getItem("rooms")) || [];

    // Filter rooms with status marked as 'available'
    const available = rooms.filter(room => room.status === "available");

    // Get reference to the table body where rows will be appended
    const tableBody = document.getElementById("availableRoomsTableBody");

    // Loop through each available room and create a table row
    available.forEach(room => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${room.name}</td>
        <td>${room.type}</td>
        <td>${room.price}</td>
        <td>${room.view}</td>
        <td>${room.description}</td>
      `;
      tableBody.appendChild(row); // Add row to the table
    });
  </script>
</body>
</html>
