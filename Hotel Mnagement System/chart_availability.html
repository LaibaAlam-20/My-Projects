<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Room Availability - KHAAB GHAR</title>

  <!-- Chart.js library for rendering charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Bootstrap for styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Basic body styling with gradient and custom font */
    body {
      background: linear-gradient(#bfbaa1, #e8e5d1);
      font-family: 'Segoe UI', sans-serif;
    }

    /* Container for chart section */
    .chart-wrapper {
      margin-top: 100px;
      text-align: center;
    }

    /* Back button styling */
    .back-btn {
      background-color: #6a644c;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      margin-bottom: 20px;
    }

    /* Chart container for responsive layout */
    .chart-container {
      width: 100%;
      max-width: 500px;
      height: 400px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container chart-wrapper">
    <!-- Button to go back to the previous page -->
    <button class="back-btn" onclick="history.back()">← Back</button>

    <!-- Chart title -->
    <h3>Room Availability</h3>

    <!-- Chart canvas element -->
    <div class="chart-container">
      <canvas id="availabilityChart"></canvas>
    </div>
  </div>

  <script>
    // Retrieve room data from localStorage or fallback to empty array
    const rooms = JSON.parse(localStorage.getItem("rooms")) || [];

    // Filter rooms that are marked as 'available'
    const availableRooms = rooms.filter(room => room.status === "available");

    // Count how many available rooms exist per room type
    const roomTypeCounts = {};
    availableRooms.forEach(room => {
      roomTypeCounts[room.type] = (roomTypeCounts[room.type] || 0) + 1;
    });

    // Get chart labels and data from roomTypeCounts object
    const labels = Object.keys(roomTypeCounts);  // Room types (e.g., Deluxe, Suite)
    const data = Object.values(roomTypeCounts);  // Corresponding counts

    // Prepare Chart.js and render the bar chart
    const ctx = document.getElementById('availabilityChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Available Rooms',
          data: data,
          backgroundColor: '#5a4e3c'  // Consistent with site theme
        }]
      },
      options: {
        responsive: true,           // Responsive chart design
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true      // Y-axis starts at 0
          }
        }
      }
    });
  </script>
</body>
</html>
