<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bookings by Type - KHAAB GHAR</title>  
  
  <!-- Chart.js library for rendering charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Bootstrap for styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Basic body styling with gradient and custom font */
    body {
      background: linear-gradient(#bfbaa1, #e8e5d1);
      font-family: 'Segoe UI', sans-serif;
    }

    /* Container for chart section */
    .chart-wrapper {
      margin-top: 100px;
      text-align: center;
    }

    /* Back button styling */
    .back-btn {
      background-color: #6a644c;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      margin-bottom: 20px;
    }

    /* Chart container for responsive layout */
    .chart-container {
      width: 100%;
      max-width: 400px;
      height: 400px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container chart-wrapper">
    <!-- Button to go back to the previous page -->
    <button class="back-btn" onclick="history.back()">← Back</button>

    <!-- Chart title -->
    <h3>Bookings by Room Type</h3>

    <!-- Chart canvas element -->
    <div class="chart-container">
      <canvas id="bookingChart"></canvas>
    </div>
  </div>

  <script>
    // Retrieve bookings and room data from localStorage
    const bookings = JSON.parse(localStorage.getItem("bookings")) || [];
    const rooms = JSON.parse(localStorage.getItem("rooms")) || [];
  
    // Create a map from roomName to roomType
    const roomTypeMap = {};
    rooms.forEach(room => {
      roomTypeMap[room.name] = room.type; // Mapping room name to its type
    });
  
    // Count the number of bookings per room type using roomName → roomType map
    const typeCounts = {};
    bookings.forEach(booking => {
      const roomType = roomTypeMap[booking.roomName] || 'Unknown';  // Get room type from map
      typeCounts[roomType] = (typeCounts[roomType] || 0) + 1;  // Increment booking count for the room type
    });
  
    // Extract labels (room types) and data (booking counts) from the typeCounts object
    const labels = Object.keys(typeCounts);
    const data = Object.values(typeCounts);

    // Predefined colors for the pie chart segments (limited to the number of room types)
    const colors = ['#3498db', '#2ecc71', '#f1c40f', '#e67e22', '#9b59b6'];
  
    // Set up and render the pie chart with Chart.js
    const ctx = document.getElementById('bookingChart').getContext('2d');
    new Chart(ctx, {
      type: 'pie',  // Using a pie chart to represent room type distribution
      data: {
        labels: labels,  // Room types as chart labels
        datasets: [{
          data: data,  // Number of bookings for each room type
          backgroundColor: colors.slice(0, labels.length)  // Slice the color array to match room types
        }]
      },
      options: {
        responsive: true,  // Ensure the chart is responsive
        maintainAspectRatio: false  // Allow the chart to adapt to the container's size
      }
    });
  </script>
</body>
</html>
