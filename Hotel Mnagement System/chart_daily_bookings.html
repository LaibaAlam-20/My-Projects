<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Daily Bookings - KHAAB GHAR</title>  

  <!-- Chart.js library for rendering charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Bootstrap for styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Basic body styling with gradient and custom font */
    body {
      background: linear-gradient(#bfbaa1, #e8e5d1);
      font-family: 'Segoe UI', sans-serif;
    }

    /* Container for chart section */
    .chart-wrapper {
      margin-top: 100px;
      text-align: center;
    }

    /* Back button styling */
    .back-btn {
      background-color: #6a644c;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      margin-bottom: 20px;
    }

    /* Chart container for responsive layout */
    .chart-container {
      width: 100%;
      max-width: 600px;
      height: 400px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container chart-wrapper">
    <!-- Button to go back to the previous page -->
    <button class="back-btn" onclick="history.back()">← Back</button>

    <!-- Chart title -->
    <h3>Daily Bookings - Last 7 Days</h3>

    <!-- Chart canvas element -->
    <div class="chart-container">
      <canvas id="dailyBookingChart"></canvas>
    </div>
  </div>

  <script>
    // Retrieve bookings data from localStorage
    const bookings = JSON.parse(localStorage.getItem("bookings")) || [];
  
    // Generate the last 7 dates in 'YYYY-MM-DD' format (from today back to 6 days ago)
    const days = [];
    const counts = {};  // Object to store count of bookings per day
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);  // Set date to the past 7 days
      const dateStr = d.toISOString().split('T')[0];  // Convert date to 'YYYY-MM-DD' format
      days.push(dateStr);
      counts[dateStr] = 0;  // Initialize count for each day as 0
    }
  
    // Count the number of bookings per day based on the check-in date
    bookings.forEach(b => {
      const date = new Date(b.checkIn);  // Extract check-in date from booking
      const key = date.toISOString().split('T')[0];  // Format check-in date to 'YYYY-MM-DD'
      if (counts.hasOwnProperty(key)) {  // If the date exists in our range
        counts[key]++;  // Increment the count for that day
      }
    });
  
    // Convert date strings to weekdays for display on the X-axis
    const labels = days.map(d => {
      const dateObj = new Date(d);
      return dateObj.toLocaleDateString('en-US', { weekday: 'short' });  // Short weekday names (e.g., Mon, Tue, ...)
    });
  
    // Map the booking counts to the data array
    const data = days.map(d => counts[d]);
  
    // Get the canvas element to render the chart
    const ctx = document.getElementById('dailyBookingChart').getContext('2d');
  
    // Create and render the line chart with Chart.js
    new Chart(ctx, {
      type: 'line',  // Line chart for showing trends over time
      data: {
        labels: labels,  // Weekday names as labels on the X-axis
        datasets: [{
          label: 'Bookings',  // Label for the data set
          data: data,  // The number of bookings for each day
          borderColor: '#6a644c',  // Line color
          backgroundColor: 'rgba(106, 100, 76, 0.3)',  // Line fill color
          fill: true,  // Fill the area below the line
          tension: 0.3  // Smooth the curve of the line
        }]
      },
      options: {
        responsive: true,  // Ensure the chart is responsive to screen size
        maintainAspectRatio: false,  // Allow the chart to resize within its container
        scales: {
          y: {
            beginAtZero: true,  // Start Y-axis from 0
            ticks: {
              stepSize: 1  // Set step size on Y-axis to 1
            }
          }
        },
        plugins: {
          legend: {
            labels: {
              color: '#5a4e3c',  // Set legend label color
              font: {
                size: 14  // Set font size for legend
              }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
