<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - KHAAB GHAR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* General body styling */
    body {
      background: linear-gradient(#bfbaa1, #e8e5d1);
      font-family: 'Segoe UI', sans-serif;
    }

    /* Navbar styles */
    .navbar {
      background-color: #000;
    }

    .navbar-brand, .nav-link {
      color: #fff !important;
      font-weight: bold;
    }

    /* Logout button styling */
    .logout-btn {
      background-color: #3e2f22;
      color: white;
      border-radius: 10px;
      padding: 8px 16px;
      border: none;
    }

    .logout-btn:hover {
      background-color: #2d2218;
    }

    /* Page container spacing */
    .container {
      margin-top: 80px;
    }

    /* Dashboard header styling */
    .dashboard-header {
      text-align: center;
      color: #6a644c;
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* Admin tools box styling */
    .admin-tools {
      background-color: #f9f8e6;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      margin-bottom: 30px;
    }

    .admin-tools h5 {
      font-size: 1.5rem;
      color: #5a4e3c;
    }

    .admin-tools .btn {
      background-color: #6a644c;
      color: white;
      border-radius: 10px;
      padding: 10px 20px;
      margin-top: 10px;
    }

    .admin-tools .btn:hover {
      background-color: #5a4e3c;
    }

    /* Chart selector section */
    .chart-selector {
      background-color: #f9f8e6;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .form-select {
      border-radius: 10px;
      padding: 10px;
    }

    .btn-view {
      background-color: #6a644c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .btn-view:hover {
      background-color: #5a4e3c;
    }
  </style>
</head>
<body>

  <!-- Navbar with logo and logout button -->
  <nav class="navbar navbar-expand-lg navbar-dark position-fixed w-100 top-0" style="background-color: #5a4e3c;">
    <div class="container-fluid d-flex justify-content-between">
      <a class="navbar-brand" href="index.html">
        <img src="logo.png" alt="Logo" width="40" height="40" class="me-2">
        <span>KHAAB GHAR</span>
      </a>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container">

    <!-- Admin Dashboard Header -->
    <div class="dashboard-header">
      <h2>Admin Dashboard</h2>
      <!-- Dynamic greeting with admin's name -->
      <p>Welcome, <span id="adminName"></span></p>
    </div>

    <!-- Admin Tool Buttons -->
    <div class="admin-tools">
      <h5>Admin Dashboard Tools:</h5>
      <p>Manage rooms and view current bookings & availability.</p>
      <button class="btn w-100" onclick="manageRooms()">Manage Rooms</button>
      <button class="btn w-100" onclick="viewBookings()">View Bookings</button>
      <button class="btn w-100" onclick="viewAvailableRooms()">Available Rooms</button>
    </div>

    <!-- Chart Selection Dropdown -->
    <div class="chart-selector text-center">
      <h5>Select a Chart to View</h5>
      <select class="form-select mt-3" id="chartSelect">
        <option disabled selected>Choose Chart Type</option>
        <option value="chart_bookings.html">Bookings by Type</option>
        <option value="chart_availability.html">Room Availability</option>
        <option value="chart_daily_bookings.html">Daily Bookings</option>
      </select>
      <button class="btn-view" onclick="goToChart()">View Chart</button>
    </div>

  </div>

  <script>
    // Check if admin is logged in, redirect to login if not
    const user = JSON.parse(localStorage.getItem("currentUser"));
    if (!user || user.role !== "admin") {
      window.location.href = "login.html";
    } else {
      document.getElementById("adminName").textContent = user.username;
    }

    // Logout and clear session
    function logout() {
      localStorage.removeItem("currentUser");
      window.location.href = "login.html";
    }

    // Redirect to selected chart page
    function goToChart() {
      const selected = document.getElementById("chartSelect").value;
      if (selected) {
        window.location.href = selected;
      }
    }

    // Navigate to manage rooms page
    function manageRooms() {
      window.location.href = "Manage_Rooms.html";
    }

    // Navigate to view bookings page
    function viewBookings() {
      window.location.href = "view_bookings.html";
    }

    // Navigate to available rooms page
    function viewAvailableRooms() {
      window.location.href = "available_rooms.html";
    }
  </script>

</body>
</html>
