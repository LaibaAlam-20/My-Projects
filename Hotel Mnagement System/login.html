<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - KHAAB GHAR</title>

  <!-- Bootstrap CDN for styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Internal CSS for page styling -->
  <style>
    body {
      background: linear-gradient(#bfbaa1, #e8e5d1);
      font-family: 'Segoe UI', sans-serif;
    }

    .navbar {
      background-color: #6a644c;
    }

    .navbar-brand, .nav-link {
      color: #fff !important;
      font-weight: bold;
    }

    /* Styling for the login form container */
    .login-container {
      background-color: #f9f8e6;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 400px;
      margin-top: 80px;
    }

    .login-container h3 {
      color: #5a4e3c;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    /* Input and select styling */
    .login-container input,
    .login-container select {
      border-radius: 10px;
      margin-bottom: 15px;
      padding: 10px;
      font-size: 1rem;
    }

    /* Button styling */
    .login-container button {
      background-color: #6a644c;
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 1.1rem;
      width: 100%;
    }

    .login-container button:hover {
      background-color: #5a4e3c;
    }

    /* Logo and welcome header styles */
    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-container img {
      width: 100px;
      margin-bottom: 15px;
    }

    .logo-container h1 {
      color: #6a644c;
      font-size: 2rem;
      font-weight: bold;
    }

    .navbar-brand span {
      font-size: 1.5rem;
      color: #fff;
    }

    .text-center {
      color: #6e6a52;
      font-size: 1rem;
    }

    .text-success {
      color: #3e8a49;
    }

    .text-danger {
      color: #e74c3c;
    }

  </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

  <!-- Navigation Bar with Logo -->
  <nav class="navbar navbar-expand-lg navbar-dark position-fixed w-100 top-0">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <img src="logo.png" alt="Logo" width="40" height="40" class="me-2">
        <span>KHAAB GHAR</span>
      </a>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="login-container">
    <!-- Logo and Welcome Heading -->
    <div class="logo-container">
      <img src="logo.png" alt="KHAAB GHAR Logo">
      <h1>Welcome to KHAAB GHAR</h1>
    </div>

    <!-- Login Form Heading -->
    <h3 class="text-center">Login</h3>

    <!-- Input for Username -->
    <input type="text" id="username" class="form-control mb-2" placeholder="Full Name">

    <!-- Input for Password -->
    <input type="password" id="password" class="form-control mb-2" placeholder="Password">

    <!-- Dropdown to Select Role -->
    <select id="role" class="form-control mb-3">
      <option value="" disabled selected>Select Role</option>
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>

    <!-- Login Button -->
    <button onclick="login()">Login</button>

    <!-- Message area for success or error -->
    <div id="msg" class="text-center mt-2"></div>

    <!-- Loading Spinner (hidden by default) -->
    <div id="spinner" class="text-center mt-3" style="display: none;">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  </div>

  <!-- JavaScript Login Logic -->
  <script>
    function login() 
    {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const role = document.getElementById("role").value;
      const msg = document.getElementById("msg");
      const spinner = document.getElementById("spinner");

      msg.innerHTML = "";
      spinner.style.display = "block"; // Show spinner

      // Simulate a short delay to show the spinner effect
      setTimeout(() => {
        if (!username || !password) {
          spinner.style.display = "none"; // Hide spinner
          msg.innerHTML = `<span class="text-danger">All fields are required</span>`;
          return;
        }

        const users = JSON.parse(localStorage.getItem("users") || "[]");
        const user = users.find(u => u.username === username && u.password === password && u.role === role);

        if (!user) {
          spinner.style.display = "none"; // Hide spinner
          msg.innerHTML = `<span class="text-danger">Invalid credentials or role</span>`;
          return;
        }

        localStorage.setItem("currentUser", JSON.stringify(user));
        msg.innerHTML = `<span class="text-success">Login successful!</span>`;

        setTimeout(() => {
          spinner.style.display = "none"; // Hide spinner before redirection
          if (role === "admin") {
            window.location.href = "dashboard_admin.html";
          } else {
            window.location.href = "dashboard_user.html";
          }
        }, 1000);
      }, 500); // Short delay to simulate processing
    }
  </script>

</body>
</html>
