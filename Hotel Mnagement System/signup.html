<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup - KHAAB GHAR</title>
  <!-- Bootstrap CDN for styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* General body styling */
    body {
      background: linear-gradient(#bfbaa1, #e8e5d1);
      font-family: 'Segoe UI', sans-serif;
    }

    /* Navbar styling */
    .navbar {
      background-color: #6a644c;
    }

    .navbar-brand, .nav-link {
      color: #fff !important;
      font-weight: bold;
    }

    /* Signup form container */
    .signup-container {
      background-color: #f9f8e6;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 450px;
      margin-top: 80px;
    }

    .signup-container h3 {
      color: #5a4e3c;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    /* Form elements styling */
    .signup-container input,
    .signup-container select {
      border-radius: 10px;
      margin-bottom: 15px;
      padding: 10px;
      font-size: 1rem;
    }

    /* Signup button styling */
    .signup-container button {
      background-color: #6a644c;
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 1.1rem;
      width: 100%;
    }

    .signup-container button:hover {
      background-color: #5a4e3c;
    }

    /* Logo and welcome message */
    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-container img {
      width: 100px;
      margin-bottom: 15px;
    }

    .logo-container h1 {
      color: #6a644c;
      font-size: 2rem;
      font-weight: bold;
    }

    .navbar-brand span {
      font-size: 1.5rem;
      color: #fff;
    }

    .text-center {
      color: #6e6a52;
      font-size: 1rem;
    }

    .text-success {
      color: #3e8a49;
    }

    .text-danger {
      color: #e74c3c;
    }
  </style>
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

  <!-- Navigation bar -->
  <nav class="navbar navbar-expand-lg navbar-dark position-fixed w-100 top-0">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">
        <img src="logo.png" alt="Logo" width="40" height="40" class="me-2">
        <span>KHAAB GHAR</span>
      </a>
    </div>
  </nav>

  <!-- Signup Form Container -->
  <div class="signup-container">
    <div class="logo-container">
      <img src="logo.png" alt="KHAAB GHAR Logo">
      <h1>Welcome to KHAAB GHAR</h1>
    </div>
    <h3 class="text-center">Signup</h3>

    <!-- Signup Form Fields -->
    <input type="text" id="name" class="form-control mb-2" placeholder="Full Name">
    <input type="email" id="email" class="form-control mb-2" placeholder="Email Address">
    <input type="text" id="contact" class="form-control mb-2" placeholder="Contact Number">
    <input type="text" id="cnic" class="form-control mb-2" placeholder="CNIC Number">
    <input type="password" id="password" class="form-control mb-2" placeholder="Password">

    <!-- Role Selection Dropdown -->
    <select id="role" class="form-control mb-3">
        <option value="" disabled selected>Select Role</option>
        <option value="user">User</option>
        <option value="admin">Admin</option>
    </select>

    <!-- Signup Button -->
    <button onclick="signup()">Signup</button>

    <!-- Message Area (for success or error messages) -->
    <div id="msg" class="text-center mt-2"></div>
  </div>

  <!-- Signup Functionality -->
  <script>
    function signup() {
      // Get form values
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const cnic = document.getElementById("cnic").value.trim();
      const password = document.getElementById("password").value.trim();
      const role = document.getElementById("role").value;
      const msg = document.getElementById("msg");

      // Check if any field is empty
      if (!name || !email || !contact || !cnic || !password) {
        msg.innerHTML = `<span class="text-danger">All fields are required</span>`;
        return;
      }

      // Retrieve existing users from localStorage or initialize empty array
      const users = JSON.parse(localStorage.getItem("users") || "[]");

      // Check if user with the same username (name) already exists
      if (users.find(u => u.username === name || u.email === email)) 
      {
        msg.innerHTML = `<span class="text-danger">User with this name or email already exists</span>`;
        return;
      }

      // Add new user object to the users array
      users.push({ 
        name, 
        email, 
        contact, 
        cnic, 
        username: name,  // Username stored for login check
        password, 
        role 
      });

      // Save updated users array back to localStorage
      localStorage.setItem("users", JSON.stringify(users));

      // Show success message and redirect to login page after delay
      msg.innerHTML = `<span class="text-success">Signup successful! Redirecting...</span>`;
      setTimeout(() => window.location.href = "login.html", 1500);
    }
  </script>

</body>
</html>
