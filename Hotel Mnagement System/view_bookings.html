<!-- View Bookings - Admin Dashboard -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Bookings - KHAAB GHAR</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Page background and typography */
    body {
      background: linear-gradient(#bfbaa1, #e8e5d1);
      font-family: 'Segoe UI', sans-serif;
    }

    /* Container styling */
    .container {
      background-color: #f8f7eb;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    /* Heading styling */
    h2 {
      color: #5a4e3c;
      font-weight: bold;
    }

    /* Table styling */
    .table {
      background-color: #fff;
      border-radius: 10px;
      overflow: hidden;
    }

    /* Table header styling */
    .table th {
      background-color: #6a644c !important;
      color: #fff;
    }

    /* Table cell text color */
    .table td {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4 text-center">All Bookings</h2>
    <!-- Bookings table -->
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>Username</th>
          <th>Room Name</th>
          <th>Check-in</th>
          <th>Check-out</th>
        </tr>
      </thead>
      <tbody id="bookingsTableBody"></tbody>
    </table>
  </div>

  <script>
    // Retrieve bookings from localStorage or default to an empty array
    const bookings = JSON.parse(localStorage.getItem("bookings")) || [];

    // Sort bookings by check-in date (latest first)
    bookings.sort((a, b) => new Date(b.checkIn) - new Date(a.checkIn));

    // Get reference to the table body
    const tableBody = document.getElementById("bookingsTableBody");

    // Loop through each booking and add a row to the table
    bookings.forEach(booking => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${booking.username || 'N/A'}</td>
        <td>${booking.roomName}</td>
        <td>${booking.checkIn}</td>
        <td>${booking.checkOut}</td>
      `;
      tableBody.appendChild(row);
    });
  </script>
</body>
</html>
